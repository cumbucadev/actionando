name: Verify Assign and Link

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  issues:
    types:
      - assigned
      - unassigned

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify_assign_and_link:
    name: Verify if PR is linked to an issue and assigned to a user
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve pull request context
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUMBER="$EVENT_PR_NUMBER"
          PR_AUTHOR="$EVENT_PR_AUTHOR"

          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            PR_NUMBER=$(gh api \
              "repos/$REPOSITORY/issues/$ISSUE_NUMBER/pulls" \
              --jq '.[0].number // empty')

            if [ -n "$PR_NUMBER" ]; then
              PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
            fi
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with issue #$ISSUE_NUMBER."
            exit 0
          fi

          printf 'pr_number=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'PR_NUMBER=%s\n' "$PR_NUMBER" >> "$GITHUB_ENV"
          printf 'PR_AUTHOR=%s\n' "$PR_AUTHOR" >> "$GITHUB_ENV"

      - name: Verify if PR is linked to an issue
        id: verify_link
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(gh pr view "$PR_NUMBER" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number // empty')

          if [ -z "$ISSUE_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --add-label "Needs Issue"
            printf 'issue_number=\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid issue number extracted from PR body."
            printf 'issue_number=\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          printf 'issue_number=%s\n' "$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'ISSUE_NUMBER=%s\n' "$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Comment when PR is not linked to an issue
        if: always() && steps.find_pr.outputs.pr_number != '' && steps.verify_link.outputs.issue_number == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 #v3.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          header: issue-link-required
          message: |
            🇧🇷 **Português**
            Esta PR não está vinculada a uma issue. Por favor, vincule a issue que esta PR pretende resolver antes de continuar. Siga o [Guia do Contribuidor](https://scanapi.readthedocs.io/en/latest/contributor-guide/first-pull-request/#5-create-a-github-pr) para aprender como vincular uma issue à sua PR. As PRs devem estar associadas a uma issue antes do início da implementação.

            🇬🇧 **English**
            This PR is not linked to an issue. Please link the issue this PR is intended to resolve before continuing. Please follow the [Contributor Guide](https://scanapi.readthedocs.io/en/latest/contributor-guide/first-pull-request/#5-create-a-github-pr) to learn how to link an issue to a PR. PRs should be associated with an issue before implementation starts.

      - name: Verify if issue is assigned to PR author
        id: verify_assignment
        if: steps.find_pr.outputs.pr_number != '' && steps.verify_link.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSIGNMENT_STATUS=$(gh issue view "$ISSUE_NUMBER" \
            --json assignees \
            --jq '
              if any(.assignees[]?; .login == env.PR_AUTHOR) then
                "assigned"
              elif (.assignees | length) == 0 then
                "not_assigned"
              else
                "assigned_to_someone_else"
              end')

          if [ "$ASSIGNMENT_STATUS" = "not_assigned" ]; then
            gh pr edit "$PR_NUMBER" --add-label "Needs Assignment"
            gh issue edit "$ISSUE_NUMBER" --add-label "Needs Assignment"
            printf 'status=not_assigned\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$ASSIGNMENT_STATUS" = "assigned_to_someone_else" ]; then
            gh pr edit "$PR_NUMBER" --add-label "Needs Assignment"
            gh issue edit "$ISSUE_NUMBER" --add-label "Needs Assignment"
            printf 'status=assigned_to_someone_else\n' >> "$GITHUB_OUTPUT"
            exit 1
          fi

          printf 'status=assigned\n' >> "$GITHUB_OUTPUT"

          echo "Issue #$ISSUE_NUMBER is assigned to PR author $PR_AUTHOR."

      - name: Comment when issue is not assigned to PR author
        if: always() && steps.find_pr.outputs.pr_number != '' && steps.verify_assignment.outputs.status != 'assigned' && steps.verify_assignment.outputs.status != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 #v3.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          header: issue-assignment-required
          message: |
            🇧🇷 **Português**
            Esta issue não está atualmente atribuída a você. Por favor, coordene com o responsável antes de abrir uma PR para esta issue. Se você pretende trabalhar nela, certifique-se de que a issue esteja atribuída a você primeiro. Veja o [Guia do Contribuidor](https://scanapi.readthedocs.io/en/latest/contributor-guide/?h=issue+ass#5-claim-the-issue) para mais informações.

            🇬🇧 **English**
            This issue isn't currently assigned to you. Please coordinate with the assignee before opening a PR for this issue. If you intend to work on it, please make sure the issue is assigned to you first. See the [Contributor Guide](https://scanapi.readthedocs.io/en/latest/contributor-guide/?h=issue+ass#5-claim-the-issue) for more information.

      - name: Remove assignment comment when checks pass
        if: always() && steps.find_pr.outputs.pr_number != '' && steps.verify_assignment.outputs.status == 'assigned'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 #v3.0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          header: issue-assignment-required
          delete: true

      - name: Remove validation labels when checks pass
        if: always() && steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.verify_link.outputs.issue_number }}
          ASSIGNMENT_STATUS: ${{ steps.verify_assignment.outputs.status }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "Needs Issue" 2>/dev/null || true
          fi

          if [ "$ASSIGNMENT_STATUS" = "assigned" ] && [ -n "$ISSUE_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "Needs Assignment" 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --remove-label "Needs Assignment" 2>/dev/null || true
          fi

      - name: Clean up validation on previously linked issues
        if: always() && steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ISSUE_NUMBER: ${{ steps.verify_link.outputs.issue_number }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate \
            "repos/$REPOSITORY/issues/$PR_NUMBER/timeline" \
            -H 'Accept: application/vnd.github+json' \
            --jq '.[] | select(.event == "cross-referenced" and .source.issue.number) | .source.issue.number' \
            | sort -u \
            | while read -r OLD_ISSUE_NUMBER; do
                if [ "$OLD_ISSUE_NUMBER" = "$CURRENT_ISSUE_NUMBER" ]; then
                  continue
                fi

                gh issue edit "$OLD_ISSUE_NUMBER" \
                  --remove-label "Needs Assignment" 2>/dev/null || true

                gh api --paginate \
                  "repos/$REPOSITORY/issues/$OLD_ISSUE_NUMBER/comments" \
                  --jq '.[] | select(.body | contains("This issue is not assigned to anyone yet.") or contains("This issue is currently assigned to someone else.")) | .id' \
                  | while read -r COMMENT_ID; do
                      gh api --method DELETE \
                        "repos/$REPOSITORY/issues/comments/$COMMENT_ID" || true
                    done
              done

          